<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background ocean blue gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#005588" />
    </linearGradient>
    
    <!-- Swim tube red/white stripes gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    
    <!-- Duck yellow gradient -->
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#ff9f00" />
    </linearGradient>
  </defs>

  <!-- Premium rounded app icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer white border for app style -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.9" />

  <!-- Main group translated to center of icon -->
  <g transform="translate(256, 270)">
    <!-- Water ripples behind duck -->
    <ellipse cx="0" cy="110" rx="180" ry="25" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.4" />
    <ellipse cx="0" cy="110" rx="120" ry="15" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3" />

    <!-- 1. Tail (Back of swim ring) -->
    <path d="M -130, -10 C -190, -70 -140, -10 -130, -10 Z" fill="url(#duckGrad)" stroke="#000000" stroke-width="12" stroke-linejoin="round" />

    <!-- 2. Swim Tube Body (outer ring) -->
    <ellipse cx="0" cy="30" rx="160" ry="95" fill="url(#ringGrad)" stroke="#000000" stroke-width="14" />
    
    <!-- Red/White Stripes on the swim tube -->
    <g clip-path="url(#ringClip)">
      <path d="M -80, -60 L -40, 120" stroke="#ffffff" stroke-width="40" opacity="0.9" />
      <path d="M 0, -65 L 40, 125" stroke="#ffffff" stroke-width="40" opacity="0.9" />
      <path d="M 80, -60 L 120, 120" stroke="#ffffff" stroke-width="40" opacity="0.9" />
    </g>

    <!-- Redraw outer ring border to keep outline clean over stripes -->
    <ellipse cx="0" cy="30" rx="160" ry="95" fill="none" stroke="#000000" stroke-width="14" />

    <!-- 3. Inner Hole of Swim Ring -->
    <ellipse cx="0" cy="30" rx="70" ry="40" fill="#005588" stroke="#000000" stroke-width="12" />

    <!-- 4. Duck Neck & Head rising from top-center -->
    <!-- Neck -->
    <path d="M 10, 30 L 90, -85 L 140, -15 L 20, 30" fill="url(#duckGrad)" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
    <!-- Head -->
    <circle cx="95" cy="-85" r="75" fill="url(#duckGrad)" stroke="#000000" stroke-width="14" />

    <!-- 5. Eyes with cute white reflections -->
    <circle cx="115" cy="-105" r="15" fill="#000000" />
    <circle cx="110" cy="-110" r="5" fill="#ffffff" />

    <!-- Cute pink cheek blush -->
    <circle cx="80" cy="-70" r="18" fill="#ff6b6b" opacity="0.5" />

    <!-- 6. Cute orange beak -->
    <path d="M 160, -100 C 230, -90 170, -60 160, -100 Z" fill="#ff6600" stroke="#000000" stroke-width="12" stroke-linejoin="round" />

    <!-- 7. Cute Wing on side of the swim ring -->
    <ellipse cx="-15" cy="20" rx="65" ry="40" fill="url(#duckGrad)" stroke="#000000" stroke-width="12" transform="rotate(10)" />
    
    <!-- Glossy Highlight on Swim Ring -->
    <path d="M -110, 0 C -90, -40 -30, -55 30, -50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
